name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        default: '0.1.1'

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run lint
          npm test
          npm run build

      - name: Verify release version
        run: |
          test "$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")" = "$RELEASE_VERSION"
          test "$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")" = "$RELEASE_VERSION"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            main.js manifest.json styles.css \
            --title "$RELEASE_VERSION" \
            --generate-notes
